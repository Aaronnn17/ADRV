name: Actualizar Datos de la API

on:
  schedule:
    # Lunes a Viernes: Cada 30 minutos (minutos 7 y 37 para evitar atascos en GitHub)
    - cron: '7,37 * * * 1-5'
    # Sábados y Domingos: Cada 15 minutos en minutos desplazados
    - cron: '2,17,32,47 * * * 0,6'
  
  workflow_dispatch:

# Evita que dos ejecuciones se solapen y bloqueen la cola del fin de semana
concurrency:
  group: update-data-group
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          pip install requests pycountry beautifulsoup4 cloudscraper playwright
          playwright install chromium --with-deps

      - name: Ejecutar script de Calendario
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_matches.py

      - name: Ejecutar script de Clasificación
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_standings.py

      - name: Ejecutar script de Plantilla
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_squad.py

      - name: Ejecutar script de Noticias
        run: python update_news.py

      - name: Ejecutar script de Estadísticas del Siguiente Partido
        run: python update_match_stats.py

      - name: Ejecutar script de Pronóstico del Tiempo
        run: python update_weather.py

      - name: Commit y Push de los JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json standings.json squad.json news.json match_stats.json weather.json
          git pull --rebase origin main || git pull --rebase origin master || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de datos ADRV" && git push)
