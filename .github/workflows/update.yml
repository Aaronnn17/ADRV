name: Actualizar Datos de la API

on:
  schedule:
    # Se ejecuta todos los días a las 02:00 y a las 18:00
    - cron: "0 2,18 * * *" 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Instalar dependencias (requests y pycountry)
        run: pip install requests pycountry

      - name: Ejecutar script de Calendario
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_matches.py

      - name: Ejecutar script de Clasificación
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_standings.py

      - name: Ejecutar script de Plantilla
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_squad.py

      - name: Ejecutar script de Noticias
        run: python update_news.py

      - name: Commit y Push de los JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json standings.json squad.json news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática de Calendario, Clasificación, Plantilla y Noticias"
          git push
