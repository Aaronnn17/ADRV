name: Actualizar Datos de la API

on:
  schedule:
    # Lunes a Viernes: Cada 15 minutos
    - cron: '*/15 * * * 1-5'
    # Sábados y Domingos: Cada 5 minutos
    - cron: '*/5 * * * 0,6'
  
  workflow_dispatch: # Permite ejecutarlo a mano desde GitHub cuando quieras

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALAMOS LAS LIBRERÍAS Y EL NAVEGADOR CHROMIUM REAL (IGUAL QUE EN SQUAD)
      - name: Instalar dependencias de Python
        run: |
          pip install requests pycountry beautifulsoup4 cloudscraper playwright
          playwright install chromium --with-deps

      - name: Ejecutar script de Calendario
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_matches.py

      - name: Ejecutar script de Clasificación
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_standings.py

      - name: Ejecutar script de Plantilla
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_squad.py

      - name: Ejecutar script de Noticias
        run: python update_news.py

      - name: Ejecutar script de Estadísticas del Siguiente Partido
        run: python scraper_match_stats.py

      - name: Commit y Push de los JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json standings.json squad.json news.json match_stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática de Calendario, Clasificación, Plantilla, Noticias y Estadísticas"
          git push
