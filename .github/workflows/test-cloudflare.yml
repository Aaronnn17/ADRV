name: Test Cloudflare

# Solo se ejecuta a mano desde la pestaña Actions. No toca news.json ni tu workflow update-data.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar rutas de unionrayo.es
        run: |
          pip install curl_cffi cloudscraper
          python - <<'PY'
          from curl_cffi import requests as cffi
          import cloudscraper

          BASE = "https://unionrayo.es"
          URLS = {
              "feed": f"{BASE}/feed/",
              "wp-json": f"{BASE}/wp-json/wp/v2/posts?per_page=3&_embed=wp:featuredmedia&_fields=id,slug,_embedded",
              "rest_route": f"{BASE}/?rest_route=/wp/v2/posts&per_page=3&_embed=wp:featuredmedia&_fields=id,slug,_embedded",
              "home": f"{BASE}/",
          }
          MARKS = ("just a moment", "challenge-platform", "bot verification", "cf-chl", "attention required")

          def blocked(r):
              return r.status_code in (403, 429, 503) or any(m in r.text[:5000].lower() for m in MARKS)

          def report(label, get):
              print(f"=== {label} ===")
              for name, url in URLS.items():
                  try:
                      r = get(url)
                      b = blocked(r)
                      extra = ""
                      if not b and name in ("wp-json", "rest_route"):
                          try:
                              d = r.json()
                              n_feat = sum(1 for p in d if p.get("_embedded", {}).get("wp:featuredmedia"))
                              extra = f" | JSON OK, {len(d)} posts, {n_feat} con featured"
                          except Exception:
                              extra = " | no es JSON"
                      if not b and name == "home":
                          extra = f" | jeg_thumb: {r.text.count('jeg_thumb')}"
                      estado = "BLOQUEADO" if b else "PASA"
                      print(f"  {name:11} HTTP {r.status_code} {len(r.text):>8} bytes  {estado}{extra}")
                  except Exception as e:
                      print(f"  {name:11} ERROR: {e}")

          sc = cloudscraper.create_scraper(browser={"browser": "chrome", "platform": "windows", "mobile": False})
          report("cloudscraper (lo que usas ahora)", lambda u: sc.get(u, timeout=25))
          for br in ("chrome", "safari", "firefox"):
              report(f"curl_cffi impersonate={br}", lambda u, br=br: cffi.get(u, impersonate=br, timeout=25))
          PY
