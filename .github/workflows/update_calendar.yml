name: Actualizar Calendario Rayo

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 08:00 y a las 20:00 UTC
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub cuando quieras

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_matches.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática del calendario de partidos" && git push)
